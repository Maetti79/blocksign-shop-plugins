name: Check packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: find packages/php plugins tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/gate.php
      - run: php tests/evidence.php
      - run: php tests/delivery.php
      - run: npm --prefix packages/typescript ci
      - run: npm --prefix packages/typescript test
      - run: scripts/build-woocommerce.sh
      - run: unzip -q build/blocksign-esign-woocommerce.zip -d build && php tests/woocommerce-pilot.php build/blocksign-esign
      - uses: actions/upload-artifact@v4
        with:
          name: blocksign-esign-woocommerce
          path: build/blocksign-esign-woocommerce.zip
      - run: scripts/build-prestashop.sh
      - run: unzip -q build/blocksign-esign-prestashop.zip -d build && php tests/prestashop-pilot.php build/blocksignesign
      - uses: actions/upload-artifact@v4
        with:
          name: blocksign-esign-prestashop
          path: build/blocksign-esign-prestashop.zip
      - run: scripts/build-shopware.sh
      - run: unzip -q build/blocksign-esign-shopware.zip -d build && php tests/shopware-pilot.php build/BlockSignEsign
      - uses: actions/upload-artifact@v4
        with:
          name: blocksign-esign-shopware
          path: build/blocksign-esign-shopware.zip
      - run: packages/typescript/node_modules/.bin/tsc -p plugins/shopify/tsconfig.json
      - run: scripts/build-shopify.sh
      - run: unzip -q build/blocksign-esign-shopify.zip -d build && node --test build/blocksign-shopify/tests/shopify.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: blocksign-esign-shopify
          path: build/blocksign-esign-shopify.zip
      - run: scripts/build-jtl-shop.sh
      - run: unzip -q build/blocksign-esign-jtl-shop.zip -d build && php tests/jtl-shop-pilot.php build/blocksign_esign
      - uses: actions/upload-artifact@v4
        with:
          name: blocksign-esign-jtl-shop
          path: build/blocksign-esign-jtl-shop.zip
      - run: scripts/build-prestashop-checkout.sh
      - run: unzip -q build/blocksign-checkout-prestashop.zip -d build && php tests/prestashop-checkout.php build/blocksigncheckout
      - uses: actions/upload-artifact@v4
        with:
          name: blocksign-checkout-prestashop
          path: build/blocksign-checkout-prestashop.zip
